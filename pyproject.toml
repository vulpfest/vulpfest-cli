[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulpfest"
version = "1.0.3"
description = "All four free Vulpfest Lab tools in one terminal command: web security scanner, scam-link checker, LeadScout and GMaps Scout."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Febri Osht (Vulpfest)" }]
keywords = ["security", "scanner", "anti-scam", "phishing", "vulpfest", "osint"]
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
leads = ["ddgs>=6.0", "pandas>=2.0"]
gmaps = ["selenium>=4.0", "webdriver-manager>=4.0", "pandas>=2.0", "xlsxwriter>=3.0", "openpyxl>=3.0"]
all = ["ddgs>=6.0", "pandas>=2.0", "selenium>=4.0", "webdriver-manager>=4.0", "xlsxwriter>=3.0", "openpyxl>=3.0"]

[project.urls]
Homepage = "https://lab.vulpfest.com"
Source = "https://github.com/vulpfest/vulpfest-cli"

[project.scripts]
vulpfest = "vulpfest.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vulpfest"]
