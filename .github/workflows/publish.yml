name: Publish to PyPI

# Terbit otomatis saat sebuah Release dipublikasikan di GitHub.
# Tanpa token: PyPI mempercayai workflow ini lewat Trusted Publishing (OIDC).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VER" ]; then echo "Release tag $GITHUB_REF_NAME does not match version $VER in pyproject.toml"; exit 1; fi
      - name: Test
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # izin sementara untuk Trusted Publishing, hanya di job ini
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
